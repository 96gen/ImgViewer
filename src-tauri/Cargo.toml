[package]
name = "imgviewer"
version = "0.2.0"
description = "A small, secure Windows image viewer"
authors = ["ImgViewer contributors"]
license = "MIT"
repository = "https://github.com/96gen/ImgViewer"
edition = "2024"
rust-version = "1.88"

[workspace]
members = [
    "crates/codec-core",
    "crates/codec-helper",
    "crates/codec-protocol",
]
default-members = ["."]
resolver = "3"

[lib]
name = "imgviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Transitional compatibility for existing development commands. Native HEIF
# dependencies live only in imgviewer-codec-core and are not forwarded into
# the Tauri application process.
heic = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
imgviewer-codec-core = { version = "=0.2.0", path = "crates/codec-core" }
imgviewer-codec-protocol = { version = "=0.2.0", path = "crates/codec-protocol" }
parking_lot = "=0.12.4"
rand = "=0.9.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tempfile = "=3.20.0"
