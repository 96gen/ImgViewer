[package]
name = "imgviewer"
version = "0.2.1"
description = "A small, secure Windows image viewer"
authors = ["ImgViewer contributors"]
license = "MIT"
repository = "https://github.com/96gen/ImgViewer"
edition = "2024"
rust-version = "1.88"

[lib]
name = "imgviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# The portable release pipeline enables this feature after provisioning the
# pinned libheif vcpkg dependency. Keeping it optional lets contributors run
# the pure-Rust test suite without VCPKG_ROOT.
heic = ["dep:libheif-rs", "dep:libheif-sys"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
libheif-rs = { version = "=2.7.0", optional = true, default-features = false, features = ["v1_21"] }
libheif-sys = { version = "=5.2.0", optional = true, default-features = false, features = ["v1_21"] }
moxcms = "=0.8.1"
parking_lot = "=0.12.4"
png = "=0.18.1"
rand = "=0.9.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.20.0"
tiff = "=0.10.3"
