[package]
name = "imgviewer-codec-helper"
version = "0.3.0"
description = "Private out-of-process codec helper for ImgViewer"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = []
heic = ["imgviewer-codec-core/heic"]

[dependencies]
imgviewer-codec-core = { version = "=0.3.0", path = "../codec-core" }
imgviewer-codec-protocol = { version = "=0.3.0", path = "../codec-protocol" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "imgviewer-codec-helper"
path = "src/main.rs"
