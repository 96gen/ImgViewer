[package]
name = "imgviewer-codec-core"
version = "0.4.0"
description = "Path-independent bounded image decode engine for ImgViewer"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = []
heic = ["dep:libheif-rs", "dep:libheif-sys"]
tiff = ["image/tiff"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libheif-rs = { version = "=2.7.0", optional = true, default-features = false, features = ["v1_21"] }
libheif-sys = { version = "=5.3.1", optional = true, default-features = false, features = ["v1_21"] }
moxcms = "=0.8.1"
png = "=0.18.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[dev-dependencies]
tempfile = "=3.20.0"
tiff = "=0.11.3"

[lib]
path = "src/lib.rs"
