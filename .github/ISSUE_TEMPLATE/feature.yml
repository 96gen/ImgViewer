name: 功能建議
description: 提出符合圖片專用、離線、唯讀邊界的改善
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ImgViewer 不規劃 PDF、影片、編輯、媒體庫、網路、遙測、自動更新
        或外部 plugin API。
  - type: textarea
    id: problem
    attributes:
      label: 想解決的實際問題
      description: 請描述工作流程與目前阻礙，不只描述解法。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議行為
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方式
  - type: checkboxes
    id: boundary
    attributes:
      label: 邊界確認
      options:
        - label: 此建議維持 Windows、離線、唯讀、圖片專用。
          required: true
