name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories, duplicate dependencies, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ./src-tauri/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources

  windows-tests:
    name: Windows frontend and Rust tests
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, toolchain pinned below
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      - name: Frontend production build
        run: pnpm build

      - name: Rust formatting
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all -- --check

      - name: Rust lint without isolated codec features
        run: cargo clippy --locked --manifest-path ./src-tauri/Cargo.toml --workspace --all-targets --no-default-features -- -D warnings

      - name: Rust tests without isolated codec features
        run: cargo test --locked --manifest-path ./src-tauri/Cargo.toml --workspace --no-default-features
