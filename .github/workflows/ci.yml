name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows frontend and Rust tests
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      - name: Frontend production build
        run: pnpm build

      - name: Rust formatting
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all -- --check

      - name: Rust lint without native HEIC
        run: cargo clippy --manifest-path ./src-tauri/Cargo.toml --all-targets --no-default-features -- -D warnings

      - name: Rust tests without native HEIC
        run: cargo test --manifest-path ./src-tauri/Cargo.toml --no-default-features
