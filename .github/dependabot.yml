version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      tauri-frontend:
        patterns:
          - "@tauri-apps/*"
      vue-runtime:
        patterns:
          - "vue"
      frontend-tooling:
        patterns:
          - "@vitejs/*"
          - "@vue/test-utils"
          - "jsdom"
          - "typescript"
          - "vite"
          - "vitest"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      native-codecs:
        patterns:
          - "image"
          - "libheif-rs"
          - "libheif-sys"
          - "moxcms"
          - "png"
          - "tiff"
      tauri-runtime:
        patterns:
          - "tauri"
          - "tauri-build"
          - "tauri-plugin-*"
      rust-core:
        patterns:
          - "parking_lot"
          - "rand"
          - "serde"
          - "serde_json"
          - "tempfile"
          - "windows-sys"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      workflow-actions:
        patterns:
          - "*"
